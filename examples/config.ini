; Copy to your data directory. Settings can also change these from the tray.
[ui]
profile=llama
hotkey=^!l
metrics=vram,ram,gpu
refresh_seconds=3
gpu_index=0
warning_percent=70
critical_percent=90
hover=1
hover_delay_ms=1000
panel_transparency_percent=10
notifications=1
; Optional trusted .ps1, run once when tray starts and via Reconnect menu.
connection_script=
; Opt-in: rerun an idempotent connection helper every 60 seconds (0 disables).
; Does not start the model. Disable before deliberately stopping tunnels.
connection_retry_seconds=0
pinned=0

[position]
x=-1
y=-1

; Copy to your data directory. Settings can also change these from the tray.
[ui]
profile=llama
hotkey=^!l
metrics=vram,ram,gpu
refresh_seconds=3
gpu_index=0
warning_percent=70
critical_percent=90
hover=1
notifications=1
; Optional trusted .ps1, run once when tray starts and via Reconnect menu.
connection_script=
pinned=0

[position]
x=-1
y=-1
